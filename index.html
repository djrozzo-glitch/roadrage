<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD RAGE '96 — Highway Havoc</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b14;font-family:Arial,Helvetica,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(5,7,14,.45),rgba(4,6,15,.9));pointer-events:auto}#overlay.hidden{display:none}.menu{width:min(92vw,570px);padding:30px 33px 27px;background:#10131fe9;border:2px solid #f2cf4a;box-shadow:0 0 0 6px #1116,0 18px 75px #000c;transform:skewY(-1deg)}.eyebrow{color:#fd9b76;font-weight:900;letter-spacing:5px;font-size:13px}.title{font-size:clamp(42px,10vw,81px);line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-5px;color:#f5d44e;text-shadow:5px 6px 0 #b43f40;margin:16px 0}.subtitle{color:#eef1f5;font-size:16px;letter-spacing:3px;font-weight:bold;margin-bottom:25px}.desc{color:#bbc2d1;font-size:15px;line-height:1.6}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:20px 0;color:#ddd;font-size:13px}.controls strong{color:#f5d44e}button{cursor:pointer;border:0;background:#f2cf4a;padding:13px 23px;color:#171923;font-weight:1000;letter-spacing:2px;font-size:17px;box-shadow:5px 5px 0 #b84947}button:hover{background:#fff2a6}#mobile{position:absolute;inset:0;pointer-events:none}#mobile .ctrl{pointer-events:auto;position:absolute;bottom:24px;border:2px solid #ffffff70;background:#151c28a6;color:#fff;box-shadow:none;border-radius:12px;width:64px;height:68px;padding:0;font-size:27px;letter-spacing:0;touch-action:none;user-select:none}#mobile .ctrl:active{background:#e5bc38b0}#left{left:16px}#right{left:88px}#brake{right:160px}#gas{right:88px}#hit{right:16px}#mobile{display:none}#pause{position:absolute;right:18px;top:15px;pointer-events:auto;background:#10162188;color:#fff;border:1px solid #fff8;box-shadow:none;font-size:13px;letter-spacing:0;padding:8px 12px}@media(pointer:coarse),(max-width:760px){#mobile{display:block}.menu{padding:23px}.controls{gap:6px;font-size:12px}.title{letter-spacing:-3px}#pause{right:12px}}
</style>
</head>
<body><canvas id="game"></canvas><div id="ui"><button id="pause" title="Pause (P)">Ⅱ PAUSE</button><div id="mobile"><button class="ctrl" id="left" data-key="ArrowLeft">◀</button><button class="ctrl" id="right" data-key="ArrowRight">▶</button><button class="ctrl" id="brake" data-key="ArrowDown">▾</button><button class="ctrl" id="gas" data-key="ArrowUp">▴</button><button class="ctrl" id="hit" data-key="Space">✊</button></div><div id="overlay"><div class="menu"><div class="eyebrow">ARCADE MOTORCYCLE COMBAT</div><div class="title">ROAD<br>RAGE '96</div><div class="subtitle">HIGHWAY HAVOC</div><div class="desc" id="menuDesc">Seven ruthless riders. One dangerous highway. Fight your way to the finish — and watch out for traffic.</div><div class="controls"><div><strong>↑ / W</strong> Accelerate</div><div><strong>↓ / S</strong> Brake</div><div><strong>← → / A D</strong> Steer</div><div><strong>SPACE / J</strong> Punch</div><div><strong>SHIFT / K</strong> Kick</div><div><strong>P / ESC</strong> Pause</div></div><button id="start">START RACE →</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let W=1280,H=720,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const clamp=(a,lo,hi)=>Math.max(lo,Math.min(hi,a)),lerp=(a,b,t)=>a+(b-a)*t,rand=(n)=>Math.sin(n*127.1+311.7)*43758.5453%1;
const keys=new Set(),keyMap={KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight',KeyJ:'Space',KeyK:'ShiftLeft'};let mode='menu',player,rivals,traffic,track,notice=[],cameraZ=0,shake=0,hitFlash=0,levelTime=0,finishedAt=0,last=performance.now(),lastStrike=false;
const segLen=190,roadWidth=2250,drawDistance=175,cameraDepth=1.0,cameraHeight=950,LANE=0.26;
const RACE_SEGMENTS=1050,RACE_LENGTH=RACE_SEGMENTS*segLen;
function buildTrack(){track=[];let y=0;for(let i=0;i<RACE_SEGMENTS+drawDistance+1;i++){const curve=.72*Math.sin(i/52)+.42*Math.sin(i/97)+.36*Math.sin(i/23);const y2=250*Math.sin(i/39)+140*Math.sin(i/73);track.push({index:i,curve:i<30?curve*i/30:curve,y:y2,sprites:[],cars:[]})}for(let i=10;i<RACE_SEGMENTS;i++){if(i%9===0){let side=(i*17%5<3)?-1:1;track[i].sprites.push({kind:i%27===0?'sign':(i%4===0?'palm':'tree'),side,offset:1.25+(i%4)*.34})}if(i%23===0)track[i].sprites.push({kind:'tree',side:-1,offset:2.4})}}
const colors=['#fa5177','#53e3ed','#8f78ed','#e2eaf0','#ffae3f','#81d57d','#d5a5ff'];
function reset(){buildTrack();player={z:0,x:0,speed:0,health:100,kos:0,hitCd:0,hitAnim:0,kind:'punch',lean:0,invuln:0,rank:8};rivals=Array.from({length:7},(_,i)=>({z:3700+i*1250,x:(i%2?1:-1)*(.20+((i*37)%55)/100),speed:6000+i*110,baseSpeed:5800+i*140,health:3,color:colors[i],alive:true,wobble:i*1.31,attackCd:0,stun:0,name:['VIPER','SCAR','BRUTE','RAVEN','RAZOR','GHOST','TURBO'][i]}));traffic=[];for(let i=0;i<37;i++){let z=4000+i*5300+((i*791)%1400);traffic.push({z,x:[-.67,0,.67][i%3],speed:1900+(i*109)%1200,kind:i%5===0?'truck':'car',color:['#ecefd0','#aabdc5','#a77e59','#6a98b0'][i%4]})}cameraZ=0;notice=[];shake=0;levelTime=0;finishedAt=0;mode='race';document.getElementById('overlay').classList.add('hidden');}
function popup(text,color='#ffffff'){notice.push({text,color,t:2.4});if(notice.length>5)notice.shift()}
function onHit(dmg,other=false){if(!other&&player.invuln>0)return;player.health=clamp(player.health-dmg,0,100);player.speed*=.48;player.invuln=.85;hitFlash=.45;shake=12;popup(dmg>22?'CRASH!':'OUCH!', '#ff7d73');if(player.health<=0)end(false)}
function attack(){if(mode!=='race'||player.hitCd>0)return;player.hitCd=.55;player.hitAnim=.4;player.kind=keys.has('ShiftLeft')?'kick':'punch';let range=player.kind==='kick'?.44:.38;let hits=0;for(const r of rivals){if(!r.alive)continue;if(Math.abs(r.z-player.z)<570&&Math.abs(r.x-player.x)<range){r.health-=1;r.stun=.9;r.x+=r.x>player.x?.3:-.3;hits++;popup('HIT!','#f8d452');if(r.health<=0){r.alive=false;player.kos++;popup('RIDER DOWN +250','#f8d452')}}}if(!hits)popup('SWING & MISS','#ffffff99')}
function end(success){if(mode!=='race')return;mode=success?'win':'lose';finishedAt=levelTime;const total=success?RACE_LENGTH:player.z;const score=Math.round((success?5000:0)+player.kos*250+Math.max(0,player.health)*10);document.querySelector('.eyebrow').textContent=success?'FINISH LINE':'RACE OVER';document.querySelector('.title').innerHTML=success?'RACE<br>COMPLETE':'WIPE<br>OUT';document.querySelector('.subtitle').textContent=success?`POSITION #${player.rank} • ${formatTime(finishedAt)}`:`${Math.floor(total/RACE_LENGTH*100)}% OF THE COURSE`;document.getElementById('menuDesc').innerHTML=`Score: <b>${score.toLocaleString()}</b> &nbsp; • &nbsp; Knockouts: <b>${player.kos}</b><br> ${success?'The highway is yours. Race again and beat your position.':'Your bike is wrecked. Get back on the road.'}`;document.getElementById('start').textContent='RACE AGAIN →';document.getElementById('overlay').classList.remove('hidden')}
function formatTime(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
const held=k=>keys.has(k);
function update(dt){if(mode!=='race')return;levelTime+=dt;player.hitCd=Math.max(0,player.hitCd-dt);player.hitAnim=Math.max(0,player.hitAnim-dt);player.invuln=Math.max(0,player.invuln-dt);shake=Math.max(0,shake-dt*26);hitFlash=Math.max(0,hitFlash-dt*1.3);notice.forEach(n=>n.t-=dt);notice=notice.filter(n=>n.t>0);
const up=held('ArrowUp'),down=held('ArrowDown'),left=held('ArrowLeft'),right=held('ArrowRight');const acceleration=up?3200:down?-7500:-1750;player.speed=clamp(player.speed+acceleration*dt,0,10400);const steer=(right?1:0)-(left?1:0);const steerScale=.20+player.speed/9000;player.x+=steer*dt*1.36*steerScale;const segment=track[Math.min(track.length-1,Math.floor(player.z/segLen))];player.x-=segment.curve*dt*(player.speed/10400)*.33;player.lean=lerp(player.lean,steer*.35,Math.min(1,dt*7));if(Math.abs(player.x)>1.04){player.speed=Math.min(player.speed,5200);if(Math.abs(player.x)>1.35){player.x=clamp(player.x,-1.45,1.45);if(Math.random()<dt*.7)onHit(5)}}player.z+=player.speed*dt;if(player.z>=RACE_LENGTH){player.z=RACE_LENGTH;player.rank=1+rivals.filter(r=>r.z>player.z&&r.alive).length;end(true);return}
for(const r of rivals){if(!r.alive)continue;r.attackCd=Math.max(0,r.attackCd-dt);r.stun=Math.max(0,r.stun-dt);if(r.stun>0)r.speed=Math.max(1800,r.speed-2900*dt);else r.speed=lerp(r.speed,r.baseSpeed+Math.sin(levelTime*.5+r.wobble)*360,dt*.6);r.z+=r.speed*dt;r.x+=Math.sin(levelTime*.85+r.wobble)*dt*.17;r.x=clamp(r.x,-.89,.89);if(Math.abs(r.z-player.z)<440&&Math.abs(r.x-player.x)<.29){if(player.invuln===0&&r.attackCd===0){onHit(7+r.wobble%5);r.attackCd=2.1;popup(`${r.name} ATTACKS!`,'#ff8e8e')}r.x+=r.x>player.x?.12:-.12}}
for(const c of traffic){c.z+=c.speed*dt;if(c.z<player.z-3500)c.z=player.z+25000+(c.z%30000+30000)%30000;if(Math.abs(c.z-player.z)<380&&Math.abs(c.x-player.x)<(c.kind==='truck'?.35:.29)){onHit(c.kind==='truck'?42:29);player.x+=player.x>c.x?.23:-.23;c.z+=1300}}
player.rank=1+rivals.filter(r=>r.z>player.z&&r.alive).length;if(held('Space')||held('ShiftLeft')){if(!lastStrike)attack();lastStrike=true}else lastStrike=false;
}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function proj(worldX,worldY,worldZ,cameraX,cameraY,cameraWorldZ){let dz=worldZ-cameraWorldZ;if(dz<=1)return null;let scale=cameraDepth/dz;return {x:Math.round(W/2+scale*(worldX-cameraX)*W/2),y:Math.round(H*.57-scale*(worldY-cameraY)*H/2),w:Math.round(scale*roadWidth*W/2),scale}}
function backdrop(){let sky=ctx.createLinearGradient(0,0,0,H*.66);sky.addColorStop(0,'#304b72');sky.addColorStop(.62,'#8aa1a6');sky.addColorStop(1,'#efc092');rect(0,0,W,H,sky);let hor=H*.56;ctx.fillStyle='#e7c093';ctx.beginPath();ctx.arc(W*.8,hor-115,Math.max(22,W*.026),0,Math.PI*2);ctx.fill();for(let m=0;m<3;m++){ctx.fillStyle=['#657a80','#536a70','#425e64'][m];ctx.beginPath();ctx.moveTo(0,hor+50);for(let x=0;x<=W+20;x+=20){let cy=hor-60+m*26+Math.sin((x+cameraZ*.008*(m+1))/((m+1)*70))*25+Math.sin((x+cameraZ*.003)/90)*32;ctx.lineTo(x,cy)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}rect(0,hor+34,W,H-hor,'#57745b')}
function drawObject(obj,p){if(!p||p.y>H+200)return;const s=p.w/roadWidth;let h=clamp(s*12000,1,H*4),w=h*.55,x=p.x,y=p.y;if(h<2)return;ctx.save();ctx.translate(x,y);if(obj.kind==='tree'||obj.kind==='palm'){polygon([[-w*.11,0],[w*.1,0],[w*.06,-h*.63],[-w*.06,-h*.63]],'#564333');if(obj.kind==='palm'){for(let d=-1;d<=1;d++){polygon([[0,-h*.65],[d*w*.8,-h*.68],[d*w*.43,-h*.54]],'#345c4d')}}else{for(let k=0;k<3;k++)polygon([[-w*(.5-k*.1),-h*(.23+k*.18)],[0,-h*(.95-k*.12)],[w*(.5-k*.1),-h*(.23+k*.18)]],k%2?'#355f48':'#274f42')}}else{rect(-w*.08,-h*.68,w*.16,h*.68,'#83766a');rect(-w*.6,-h*.9,w*1.2,h*.35,'#e8c94d');rect(-w*.55,-h*.85,w*1.1,h*.25,'#222a34');ctx.fillStyle='#ffd14a';ctx.textAlign='center';ctx.font=`bold ${Math.max(5,h*.115)}px monospace`;ctx.fillText('DANGER',0,-h*.68)}ctx.restore()}
function bike(x,y,size,color,lean=0,playerBike=false,attackSide=0){if(size<3)return;ctx.save();ctx.translate(x,y);ctx.rotate(lean*.3);let s=size/100;ctx.scale(s,s);
// shadow
ctx.fillStyle='#141a20a0';ctx.beginPath();ctx.ellipse(0,7,44,11,0,0,7);ctx.fill();
// wheels
rect(-12,-29,24,56,'#13151a');rect(-8,-44,16,19,'#545d62');rect(-13,-88,26,45,color);rect(-20,-82,40,13,'#1c2529');rect(-13,-58,26,18,'#1d232a');
// handlebars & arms
rect(-34,-75,68,9,'#14171b');line(-31,-73,-24,-112,'#e6b38b',8);line(31,-73,24,-112,'#e6b38b',8);
// shoulders, torso and head
polygon([[-23,-106],[23,-106],[20,-65],[-20,-65]],playerBike?'#f0d14e':'#252b38');rect(-17,-100,34,20,playerBike?'#32343b':color);ctx.fillStyle=playerBike?'#e8e9e1':color;ctx.beginPath();ctx.ellipse(0,-115,19,24,0,0,Math.PI*2);ctx.fill();rect(-12,-120,24,8,'#242b32');
// strike
if(attackSide){let side=attackSide;line(side*23,-94,side*55,-115,'#efbd9a',9);ctx.fillStyle='#f3bd8d';ctx.beginPath();ctx.arc(side*57,-117,8,0,7);ctx.fill()}
ctx.restore()}
function car(x,y,size,c){if(size<3)return;let k=size/100;ctx.save();ctx.translate(x,y);ctx.scale(k,k);rect(-38,-75,76,82,'#222731');rect(-34,-90,68,78,c.color);polygon([[-27,-84],[27,-84],[22,-47],[-22,-47]],'#344a55');rect(-38,-14,76,12,'#303943');rect(-31,-7,20,7,'#efc3a5');rect(11,-7,20,7,'#efc3a5');if(c.kind==='truck'){rect(-44,-116,88,68,c.color);rect(-39,-115,78,7,'#e4e4c5')}ctx.restore()}
function drawRoad(){const base=Math.floor(player.z/segLen),percent=(player.z%segLen)/segLen;const cameraY=cameraHeight+lerp(track[base].y,track[base+1].y,percent);let x=0,dx=0,maxy=H,segments=[];const camX=player.x*roadWidth;
for(let n=0;n<drawDistance;n++){let i=base+n;if(i>=track.length-1)break;const seg=track[i],next=track[i+1];let p1=proj(x*roadWidth-cameraDepth*0,seg.y,i*segLen,camX,cameraY,player.z-450);x+=dx;dx+=seg.curve*.014;let p2=proj(x*roadWidth,next.y,(i+1)*segLen,camX,cameraY,player.z-450);if(!p1||!p2)continue;segments.push({i,seg,p1,p2})}
for(let j=segments.length-1;j>=0;j--){let {i,p1,p2,seg}=segments[j];if(p2.y>=maxy||p1.y<=p2.y)continue;let y1=clamp(p1.y,0,H),y2=clamp(p2.y,0,H);const alt=Math.floor(i/3)%2===0;rect(0,y2,W,y1-y2,alt?'#597e56':'#527653');let rumble=alt?'#ede3c8':'#be5346',lane=alt?'#e5e3c8':'#d1d0bd';polygon([[p1.x-p1.w*1.14,p1.y],[p1.x+p1.w*1.14,p1.y],[p2.x+p2.w*1.14,p2.y],[p2.x-p2.w*1.14,p2.y]],rumble);polygon([[p1.x-p1.w,p1.y],[p1.x+p1.w,p1.y],[p2.x+p2.w,p2.y],[p2.x-p2.w,p2.y]],alt?'#454951':'#41464e');if(Math.floor(i/6)%2===0){for(let laneN=-1;laneN<=1;laneN+=2){const f=laneN/3;polygon([[p1.x+p1.w*f-p1.w*.009,p1.y],[p1.x+p1.w*f+p1.w*.009,p1.y],[p2.x+p2.w*f+p2.w*.009,p2.y],[p2.x+p2.w*f-p2.w*.009,p2.y]],lane)}}maxy=p2.y}
// world objects and riders from far to near
let visible=[];for(const s of segments){if(s.p1.y>s.p2.y&&s.p1.y<H+100){for(const sp of s.seg.sprites){const p=proj((sp.side*sp.offset)*roadWidth, s.seg.y,s.i*segLen,camX,cameraY,player.z-450);visible.push({depth:s.i*segLen,kind:'sprite',p,obj:sp})}}}
for(const c of traffic){if(c.z>player.z-100&&c.z<player.z+drawDistance*segLen){const t=c.z/segLen,idx=Math.floor(t),y=lerp(track[idx].y,track[idx+1].y,t-idx);let center=roadXAt(idx,base,percent);let p=proj(center+c.x*roadWidth,y,c.z,camX,cameraY,player.z-450);visible.push({depth:c.z,kind:'car',p,obj:c})}}
for(const r of rivals){if(!r.alive||r.z<player.z-100||r.z>player.z+drawDistance*segLen)continue;let t=r.z/segLen,idx=Math.floor(t),y=lerp(track[idx].y,track[idx+1].y,t-idx),center=roadXAt(idx,base,percent),p=proj(center+r.x*roadWidth,y,r.z,camX,cameraY,player.z-450);visible.push({depth:r.z,kind:'bike',p,obj:r})}
visible.sort((a,b)=>b.depth-a.depth);for(const v of visible){if(!v.p)continue;let size=clamp(v.p.w*2*.42,1,H*1.2);if(v.kind==='sprite')drawObject(v.obj,v.p);else if(v.kind==='car')car(v.p.x,v.p.y,size*.9,v.obj);else bike(v.p.x,v.p.y,size*.78,v.obj.color,Math.sin(levelTime*4+v.obj.wobble)*.1,false,0)}
}
function roadXAt(target,base,percent){let x=0,dx=0;for(let i=base;i<target;i++){x+=dx;dx+=track[i].curve*.014}return x*roadWidth}
function hud(){let u=Math.min(W/1280,H/720),pad=Math.max(14,25*u),font=(px)=>`900 ${Math.round(px*u)}px Arial, sans-serif`,boxWidth=Math.min(285, W*.35);ctx.fillStyle='#10151bdc';ctx.fillRect(pad,pad,boxWidth,115*u);ctx.fillStyle='#edcc4c';ctx.font=font(16);ctx.fillText('ROAD RAGE ‘96',pad+13*u,pad+24*u);ctx.fillStyle='#fff';ctx.font=font(29);ctx.fillText(`${Math.round(player.speed/52)} KM/H`,pad+13*u,pad+58*u);ctx.font=font(13);ctx.fillStyle='#aeb6c7';ctx.fillText(`HEALTH`,pad+13*u,pad+78*u);rect(pad+13*u,pad+86*u,boxWidth-26*u,11*u,'#39424d');rect(pad+13*u,pad+86*u,(boxWidth-26*u)*player.health/100,11*u,player.health<25?'#ed615a':'#7edb90');
let rx=W-pad-160*u;ctx.fillStyle='#10151bdc';ctx.fillRect(rx,pad,160*u,115*u);ctx.textAlign='center';ctx.fillStyle='#f2cf4a';ctx.font=font(12);ctx.fillText('POSITION',rx+80*u,pad+22*u);ctx.fillStyle='#fff';ctx.font=font(49);ctx.fillText(`${player.rank} / 8`,rx+80*u,pad+73*u);ctx.font=font(12);ctx.fillStyle='#d3d8db';ctx.fillText(formatTime(levelTime),rx+80*u,pad+100*u);ctx.textAlign='left';
let barW=Math.min(W*.40,460),barX=(W-barW)/2,barY=pad+11*u;rect(barX,barY,barW,13*u,'#151a23ba');rect(barX,barY,barW*player.z/RACE_LENGTH,13*u,'#f3d04b');ctx.strokeStyle='#d1d9e2a0';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,13*u);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=font(12);ctx.fillText(`${Math.floor((RACE_LENGTH-player.z)/1000)} KM TO FINISH`,W/2,barY+32*u);ctx.textAlign='left';
ctx.fillStyle='#111722a9';ctx.fillRect(pad,H-74*u,175*u,49*u);ctx.font=font(13);ctx.fillStyle='#f3d04b';ctx.fillText(`KNOCKOUTS   ${player.kos}`,pad+10*u,H-45*u);ctx.fillStyle='#fff';ctx.fillText('SPACE  PUNCH   SHIFT  KICK',pad+10*u,H-30*u);
notice.forEach((n,i)=>{ctx.textAlign='center';ctx.fillStyle=n.color;ctx.font=font(22);ctx.globalAlpha=Math.min(1,n.t);ctx.fillText(n.text,W/2,H*.27-i*28*u);ctx.globalAlpha=1});ctx.textAlign='left';if(hitFlash){ctx.fillStyle=`rgba(255,55,55,${hitFlash*.27})`;ctx.fillRect(0,0,W,H)}}
function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);backdrop();if(!track){ctx.restore();return}drawRoad();let psize=Math.min(240,H*.32),bob=Math.sin(levelTime*13)*(player.speed/10400)*5;bike(W/2+player.lean*46,H*.93+bob,psize,'#e9c849',player.lean,true,player.hitAnim>0?(player.x<0?-1:1):0);ctx.restore();if(mode==='race')hud();}
function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);render();requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',()=>{reset();last=performance.now()});document.getElementById('pause').addEventListener('click',()=>{if(mode==='race'){mode='paused';document.querySelector('.eyebrow').textContent='TAKE A BREAK';document.querySelector('.title').innerHTML='PAUSED';document.querySelector('.subtitle').textContent='THE HIGHWAY CAN WAIT';document.getElementById('menuDesc').textContent='Resume the race when you are ready.';document.getElementById('start').textContent='RESUME →';document.getElementById('overlay').classList.remove('hidden')}else if(mode==='paused'){mode='race';document.getElementById('overlay').classList.add('hidden')}});
const startBtn=document.getElementById('start');startBtn.addEventListener('click',e=>{if(mode==='paused'){e.stopImmediatePropagation();mode='race';document.getElementById('overlay').classList.add('hidden')}},true);
addEventListener('keydown',e=>{let k=keyMap[e.code]||e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if((k==='KeyP'||k==='Escape')&& !e.repeat){document.getElementById('pause').click();return}keys.add(k)});addEventListener('keyup',e=>keys.delete(keyMap[e.code]||e.code));addEventListener('blur',()=>keys.clear());
for(const el of document.querySelectorAll('[data-key]')){const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys.add(k)});const release=e=>{e.preventDefault();keys.delete(k)};el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',()=>keys.delete(k))}
buildTrack();player={z:0,x:0,speed:0,health:100,kos:0,hitCd:0,hitAnim:0,kind:'punch',lean:0,invuln:0,rank:8};rivals=[];traffic=[];requestAnimationFrame(loop);
})();
</script></body></html>
